x-backend: &backend
  build:
    context: ../backend
  env_file: .env
  environment:
    ENV: production
    DATABASE_URL: postgresql+asyncpg://fushengliunian:${POSTGRES_PASSWORD}@db:5432/fushengliunian
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fushengliunian
      POSTGRES_USER: fushengliunian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fushengliunian -d fushengliunian"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8100", "--workers", "2"]
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://fushengliunian:${POSTGRES_PASSWORD}@db:5432/fushengliunian
      GENERATION_WORKER_ENABLED: "false"
      INDEX_WORKER_ENABLED: "false"
      IMPORT_WORKER_ENABLED: "false"
      OUTBOX_WORKER_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8100:8100"

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 1

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE: /api
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
